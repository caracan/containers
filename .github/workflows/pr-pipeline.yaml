name: PR Pipeline

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    name: Auto-bump Version
    if: contains(github.event.pull_request.user.login, 'renovate') || contains(github.event.pull_request.labels.*.name, 'renovate-update')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Process Bumps
        id: process
        run: |
          UPDATED_ANY=false
          MODIFIED_SERVICES=""

          for V_FILE in */version.json; do
            [ -f "$V_FILE" ] || continue
            DIR=$(dirname "$V_FILE")
            DIFF=$(git diff --name-only origin/main...HEAD -- "$DIR" | grep -v "version.json" || true)
            V_CHECK=$(git diff --name-only origin/main...HEAD -- "$V_FILE" || true)

            if [ -n "$DIFF" ] && [ -z "$V_CHECK" ]; then
              jq '.["zstream"] |= (tonumber + 1 | tostring)' "$V_FILE" > temp.json && mv temp.json "$V_FILE"
              git add "$V_FILE"
              MODIFIED_SERVICES+="$DIR, "
              UPDATED_ANY=true
            fi
          done

          if [ "$UPDATED_ANY" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: auto-bump z-stream for ${MODIFIED_SERVICES%, }"
            git push
          fi

  detect-changes:
    name: Detect Changed Containers
    needs: [version-bump]
    if: always() && !cancelled() && !contains(needs.version-bump.result, 'failure')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect Changed Containers
        id: detect
        run: |
          CHANGED_CONTAINERS=()
          for V_FILE in */version.json; do
            [ -f "$V_FILE" ] || continue
            DIR=$(dirname "$V_FILE")
            DIFF=$(git diff --name-only origin/main...HEAD -- "$DIR" || true)
            if [ -n "$DIFF" ]; then
              FILE="Containerfile"
              [ -f "$DIR/Dockerfile" ] && FILE="Dockerfile"
              PLATFORMS=$(jq -r '.platforms // "linux/amd64"' "$V_FILE")
              CHANGED_CONTAINERS+=("{\"name\":\"$DIR\",\"file\":\"$FILE\",\"platforms\":\"$PLATFORMS\"}")
            fi
          done

          if [ ${#CHANGED_CONTAINERS[@]} -gt 0 ]; then
            MATRIX=$(IFS=,; echo "[${CHANGED_CONTAINERS[*]}]")
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  test-build:
    name: Test Build (${{ matrix.name }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Build (multi-platform, no push)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.name }}
          file: ./${{ matrix.name }}/${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: false

      - name: Run Test Script
        if: hashFiles(format('{0}/test.sh', matrix.name)) != ''
        run: |
          docker build -t "${{ matrix.name }}:test" -f ./${{ matrix.name }}/${{ matrix.file }} ./${{ matrix.name }}
          chmod +x ./${{ matrix.name }}/test.sh
          ./${{ matrix.name }}/test.sh "${{ matrix.name }}:test"

  auto-merge:
    name: Enable Auto-Merge
    needs: [version-bump, detect-changes, test-build]
    if: |
      always() &&
      (contains(github.event.pull_request.user.login, 'renovate') || contains(github.event.pull_request.labels.*.name, 'renovate-update')) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash
