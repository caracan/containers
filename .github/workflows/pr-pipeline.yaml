name: PR Pipeline

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare & Detect Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Bump Version (Renovate PRs)
        if: contains(github.event.pull_request.user.login, 'renovate') || contains(github.event.pull_request.labels.*.name, 'renovate-update')
        run: |
          UPDATED=false
          SERVICES=""
          for V_FILE in */version.json; do
            [ -f "$V_FILE" ] || continue
            DIR=$(dirname "$V_FILE")
            DIFF=$(git diff --name-only origin/main...HEAD -- "$DIR" | grep -v "version.json" || true)
            V_CHECK=$(git diff --name-only origin/main...HEAD -- "$V_FILE" || true)

            if [ -n "$DIFF" ] && [ -z "$V_CHECK" ]; then
              jq '.["zstream"] |= (tonumber + 1 | tostring)' "$V_FILE" > temp.json && mv temp.json "$V_FILE"
              git add "$V_FILE"
              SERVICES+="$DIR, "
              UPDATED=true
            fi
          done

          if [ "$UPDATED" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: auto-bump z-stream for ${SERVICES%, }"
            git push
          fi

      - name: Detect Changed Containers
        id: detect
        run: |
          DIRS=$(git diff --name-only origin/main...HEAD | cut -d/ -f1 | sort -u)
          MATRIX=$(
            for DIR in $DIRS; do
              [ -f "$DIR/version.json" ] || continue
              FILE="Containerfile"
              [ -f "$DIR/Dockerfile" ] && FILE="Dockerfile"
              PLATFORMS=$(jq -r '.platforms // "linux/amd64"' "$DIR/version.json")
              jq -n -c \
                --arg name "$DIR" \
                --arg file "$FILE" \
                --arg platforms "$PLATFORMS" \
                '{name: $name, file: $file, platforms: $platforms}'
            done | jq -c -s .
          )
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "has_changes=$([ "$MATRIX" != "[]" ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT

  test-build:
    name: Test Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Build (multi-platform, no push)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.name }}
          file: ./${{ matrix.name }}/${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: false

      - name: Run Test Script
        if: hashFiles(format('{0}/test.sh', matrix.name)) != ''
        run: |
          docker build -t "${{ matrix.name }}:test" -f ./${{ matrix.name }}/${{ matrix.file }} ./${{ matrix.name }}
          chmod +x ./${{ matrix.name }}/test.sh
          ./${{ matrix.name }}/test.sh "${{ matrix.name }}:test"

  auto-merge:
    name: Enable Auto-Merge
    needs: [prepare, test-build]
    if: |
      always() &&
      (contains(github.event.pull_request.user.login, 'renovate') || contains(github.event.pull_request.labels.*.name, 'renovate-update')) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}
